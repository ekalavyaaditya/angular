<div class="role-panel">
  <div class="role-summary">
    <div class="role-icon">
      <mat-icon aria-hidden="true">{{ persona.icon }}</mat-icon>
    </div>
    <div>
      <h2>{{ persona.label }} Workspace</h2>
      <p>{{ persona.description }}</p>
    </div>
  </div>

  <div class="responsive-grid">
    <app-stat-card
      *ngFor="let metric of metrics"
      [label]="metric.label"
      [value]="metric.value"
      [icon]="metric.icon"
      [trend]="metric.trend"
      [tone]="metric.tone">
    </app-stat-card>
  </div>
</div>
