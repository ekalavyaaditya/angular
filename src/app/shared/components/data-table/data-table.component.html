<mat-card class="table-card">
  <div class="table-toolbar">
    <h2>{{ title }}</h2>
    <mat-form-field appearance="outline" subscriptSizing="dynamic">
      <mat-icon matPrefix>search</mat-icon>
      <input
        #searchInput
        matInput
        type="text"
        placeholder="Search..."
        aria-label="Search records"
        [value]="filterValue"
        (input)="applyFilter($any($event.target).value)">
      <button
        *ngIf="filterValue"
        mat-icon-button
        matSuffix
        (click)="clearFilter()"
        aria-label="Clear filter"
        matTooltip="Clear filter">
        <mat-icon>close</mat-icon>
      </button>
    </mat-form-field>
  </div>

  <div class="table-wrap" *ngIf="dataSource.data.length || filterValue; else emptyState">
    <table mat-table matSort [dataSource]="dataSource">
      <ng-container *ngFor="let column of columns" [matColumnDef]="column.key">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>{{ column.label }}</th>
        <td mat-cell *matCellDef="let row">{{ cellValue(row, column) }}</td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

      <tr class="mat-row no-results" *matNoDataRow>
        <td class="mat-cell" [attr.colspan]="columns.length">
          No records matching the filter "{{ filterValue }}"
        </td>
      </tr>
    </table>
  </div>

  <ng-template #emptyState>
    <div class="empty-state">
      <mat-icon>table_view</mat-icon>
      <p>{{ emptyText }}</p>
    </div>
  </ng-template>

  <mat-paginator [pageSize]="5" [pageSizeOptions]="[5, 10, 25]" showFirstLastButtons></mat-paginator>
</mat-card>
