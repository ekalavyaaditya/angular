<mat-card class="table-card">
  <div class="table-toolbar">
    <h2>{{ title }}</h2>
    <mat-form-field appearance="outline">
      <mat-label>Search</mat-label>
      <mat-icon matPrefix>search</mat-icon>
      <input matInput type="text" #searchInput (input)="applyFilter(searchInput.value)">
      <button
        *ngIf="searchInput.value"
        matSuffix
        mat-icon-button
        aria-label="Clear search"
        matTooltip="Clear search"
        type="button"
        (click)="searchInput.value = ''; applyFilter(''); searchInput.focus()">
        <mat-icon>close</mat-icon>
      </button>
    </mat-form-field>
  </div>

  <div class="table-wrap" *ngIf="dataSource.data.length; else emptyState">
    <table mat-table matSort [dataSource]="dataSource">
      <ng-container *ngFor="let column of columns" [matColumnDef]="column.key">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>{{ column.label }}</th>
        <td mat-cell *matCellDef="let row">{{ cellValue(row, column) }}</td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
  </div>

  <ng-template #emptyState>
    <div class="empty-state">
      <mat-icon>table_view</mat-icon>
      <p>{{ emptyText }}</p>
    </div>
  </ng-template>

  <mat-paginator [pageSize]="5" [pageSizeOptions]="[5, 10, 25]" showFirstLastButtons></mat-paginator>
</mat-card>
