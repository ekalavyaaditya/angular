<mat-card class="table-card">
  <div class="table-toolbar">
    <h2>{{ title }}</h2>
    <mat-form-field appearance="outline">
      <mat-label>Search</mat-label>
      <mat-icon matPrefix aria-hidden="true">search</mat-icon>
      <input
        #searchInput
        matInput
        type="text"
        (input)="applyFilter($any($event.target).value)"
        placeholder="Filter records...">
      <button
        *ngIf="dataSource.filter"
        matSuffix
        mat-icon-button
        aria-label="Clear filter"
        matTooltip="Clear filter"
        (click)="clearFilter()">
        <mat-icon>close</mat-icon>
      </button>
    </mat-form-field>
  </div>

  <div class="table-wrap" *ngIf="dataSource.data.length; else emptyState">
    <table mat-table matSort [dataSource]="dataSource">
      <ng-container *ngFor="let column of columns" [matColumnDef]="column.key">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>{{ column.label }}</th>
        <td mat-cell *matCellDef="let row">{{ cellValue(row, column) }}</td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

      <tr class="mat-row no-data-row" *matNoDataRow>
        <td class="mat-cell" [attr.colspan]="columns.length">
          {{ searchInput.value ? 'No results found for "' + searchInput.value + '"' : 'No records match the current filter.' }}
        </td>
      </tr>
    </table>
  </div>

  <ng-template #emptyState>
    <div class="empty-state">
      <mat-icon>table_view</mat-icon>
      <p>{{ emptyText }}</p>
    </div>
  </ng-template>

  <mat-paginator [pageSize]="5" [pageSizeOptions]="[5, 10, 25]" showFirstLastButtons></mat-paginator>
</mat-card>
