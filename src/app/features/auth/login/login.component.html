<main class="auth-page">
  <section class="auth-art">
    <div>
      <span>BankOps</span>
      <h1>Operational banking, fraud, and payments in one console.</h1>
      <p>Secure JWT access with role-aware workspaces for every banking persona.</p>
    </div>
  </section>

  <section class="auth-form-wrap">
    <mat-card class="auth-card">
      <mat-card-header>
        <mat-card-title>Sign in</mat-card-title>
        <mat-card-subtitle>Use a registered Spring Boot API user.</mat-card-subtitle>
      </mat-card-header>
      <mat-card-content>
        <form [formGroup]="form" (ngSubmit)="submit()" class="auth-form">
          <mat-form-field appearance="outline">
            <mat-label>Email</mat-label>
            <mat-icon matPrefix>mail</mat-icon>
            <input matInput type="email" formControlName="email" autocomplete="email">
            <mat-error *ngIf="form.controls.email.hasError('required')">Email is required.</mat-error>
            <mat-error *ngIf="form.controls.email.hasError('email')">Enter a valid email.</mat-error>
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>Password</mat-label>
            <mat-icon matPrefix>lock</mat-icon>
            <input matInput [type]="hidePassword ? 'password' : 'text'" formControlName="password" autocomplete="current-password">
            <button mat-icon-button matSuffix type="button" (click)="hidePassword = !hidePassword" [matTooltip]="hidePassword ? 'Show password' : 'Hide password'" [attr.aria-label]="hidePassword ? 'Show password' : 'Hide password'">
              <mat-icon>{{ hidePassword ? 'visibility' : 'visibility_off' }}</mat-icon>
            </button>
            <mat-error>Password is required.</mat-error>
          </mat-form-field>

          <button
            mat-flat-button
            color="primary"
            type="submit"
            [disabled]="loading"
            [attr.aria-busy]="loading"
            [attr.aria-label]="loading ? 'Signing in...' : 'Sign in'">
            <mat-icon *ngIf="!loading">login</mat-icon>
            <mat-spinner *ngIf="loading" [diameter]="18"></mat-spinner>
            {{ loading ? 'Signing in...' : 'Sign in' }}
          </button>
        </form>
      </mat-card-content>
      <mat-card-actions>
        <a mat-button routerLink="/auth/register">Create account</a>
      </mat-card-actions>
    </mat-card>
  </section>
</main>
