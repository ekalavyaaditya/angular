<app-page-header
  eyebrow="Account"
  title="Profile"
  description="Authenticated user details are loaded from /api/auth/me.">
</app-page-header>

<section class="section-grid" *ngIf="user$ | async as user">
  <mat-card class="page-card">
    <h2>{{ user.fullName }}</h2>
    <p>{{ user.email }}</p>
    <div class="profile-facts">
      <span class="status-pill success">{{ user.role }}</span>
      <span class="status-pill" [class.success]="user.enabled">{{ user.enabled ? 'ENABLED' : 'DISABLED' }}</span>
      <span class="status-pill">{{ user.createdAt | date:'medium' }}</span>
    </div>
  </mat-card>

  <mat-card class="page-card">
    <h2>Preferences</h2>
    <form [formGroup]="form" (ngSubmit)="save()" class="form-grid">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Display name</mat-label>
        <input matInput formControlName="displayName" [placeholder]="user.fullName">
      </mat-form-field>
      <mat-slide-toggle formControlName="emailAlerts">Email alerts</mat-slide-toggle>
      <mat-slide-toggle formControlName="highRiskAlerts">High-risk alerts</mat-slide-toggle>
      <button mat-flat-button color="primary" type="submit">
        <mat-icon>save</mat-icon>
        Save
      </button>
    </form>
  </mat-card>
</section>
